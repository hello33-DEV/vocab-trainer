<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇工坊 · PDF词库学习助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2324435E'/%3E%3Cpath d='M18 20v26l10-5 8 5V20l-8 5z' fill='%23F7F3EA'/%3E%3Ccircle cx='46' cy='20' r='6' fill='%23D97B29'/%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1C2733; --ink-2:#5A6B7B; --ink-3:#93A1AF;
  --primary:#24435E; --primary-soft:#E8EEF4; --accent:#D97B29; --accent-soft:#FBF0E3;
  --success:#3E7C4F; --success-soft:#E7F0E9; --danger:#B3432F; --danger-soft:#F9EAE7;
  --border:#E2E7EC; --radius:14px;
  --shadow:0 1px 2px rgba(16,34,52,.05),0 6px 18px rgba(16,34,52,.06);
  --font-serif:'Noto Serif SC','Songti SC',serif;
  --font-sans:'Noto Sans SC',system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:rgba(217,123,41,.2)}
/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
#app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex-shrink:0;background:var(--primary);color:#EAF0F6;
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-family:var(--font-serif);font-weight:700;font-size:19px;letter-spacing:2px}
.brand-sub{font-size:11px;color:#AEC3D6;margin-top:1px;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:#C4D5E4;font-size:14px;font-weight:500;transition:background .15s,color .15s;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-foot{padding:10px 12px;font-size:12px;color:#8FA9BF}
.sidebar-foot button{display:flex;align-items:center;gap:9px;color:#C4D5E4;font-size:13px;padding:8px 0;width:100%}
.sidebar-foot button:hover{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:var(--font-serif);font-size:20px;font-weight:700;white-space:nowrap}
.lib-picker{
  display:flex;align-items:center;gap:8px;margin-left:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:6px 12px;font-size:13px;color:var(--ink-2);max-width:240px;
}
.lib-picker select{border:none;background:none;font-family:inherit;font-size:13px;color:var(--ink);outline:none;max-width:170px;cursor:pointer}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 12px;flex:1;max-width:340px;margin-left:auto}
.search-box svg{width:15px;height:15px;color:var(--ink-3);flex-shrink:0}
.search-box input{border:none;background:none;outline:none;width:100%;font-size:13px;color:var(--ink)}
.search-box input::placeholder{color:var(--ink-3)}
.content{flex:1;padding:24px 26px 60px;max-width:1080px;width:100%;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  font-size:13.5px;font-weight:600;transition:all .15s;border:1px solid transparent;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1B3550}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#C76E1F}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-danger-ghost{background:var(--surface);border-color:var(--border);color:var(--danger)}
.btn-danger-ghost:hover{border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head h2{font-family:var(--font-serif);font-size:19px;font-weight:700}
.section-head .desc{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.muted{color:var(--ink-2)}
.empty{
  text-align:center;padding:56px 20px;color:var(--ink-2);
}
.empty .empty-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center}
.empty .empty-icon svg{width:26px;height:26px;color:var(--primary)}
.empty h3{font-size:15.5px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13px;margin-bottom:18px}
.progress{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#4A7396);border-radius:4px;transition:width .4s ease}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.badge-blue{background:var(--primary-soft);color:var(--primary)}
.badge-orange{background:var(--accent-soft);color:var(--accent)}
.badge-green{background:var(--success-soft);color:var(--success)}
.badge-red{background:var(--danger-soft);color:var(--danger)}
.badge-gray{background:var(--bg);color:var(--ink-2)}
.tag{font-size:11px;color:var(--ink-3);border:1px solid var(--border);padding:1px 8px;border-radius:6px;margin-left:6px}
table.list-table{width:100%;border-collapse:collapse;table-layout:fixed}
.list-table th{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
.list-table td{padding:10px 12px;border-bottom:1px solid #EDF1F4;font-size:13px;vertical-align:middle}
.list-table tr:hover td{background:#FAFBFD}
.list-table .w-word{width:22%}
.list-table .w-phon{width:26%}
.list-table .w-mean{width:46%}
.list-table .w-act{width:6%}
.word-cell{font-weight:700;font-size:13.5px;color:var(--primary)}
.phon-cell{color:var(--ink-2);font-size:12.5px}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:999;max-width:80vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)}
.toast.err{background:var(--danger)}

/* ============ 词库视图 ============ */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lib-card{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
.lib-card:hover{border-color:#B9C8D6;transform:translateY(-2px)}
.lib-card .lib-top{display:flex;align-items:center;gap:10px}
.lib-ico{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lib-ico svg{width:19px;height:19px;color:var(--primary)}
.lib-name{font-weight:700;font-size:14.5px;line-height:1.3}
.lib-meta{font-size:11.5px;color:var(--ink-3)}
.lib-progress{font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;margin-top:auto}
.lib-del{position:absolute;top:10px;right:10px;color:var(--ink-3);padding:4px;border-radius:6px;opacity:0;transition:all .15s}
.lib-card:hover .lib-del{opacity:1}
.lib-del:hover{color:var(--danger);background:var(--danger-soft)}
.import-panel{margin-top:16px;padding:22px}
.import-step{display:none}
.import-step.active{display:block}
.drop-zone{
  border:2px dashed #C6D2DD;border-radius:var(--radius);padding:40px 20px;text-align:center;
  color:var(--ink-2);transition:all .2s;cursor:pointer;
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone svg{width:34px;height:34px;color:var(--accent);margin-bottom:10px}
.drop-zone .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}
.drop-zone .small{font-size:12px}
.preview-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.preview-scroll{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.preview-stat{font-size:12.5px;color:var(--ink-2);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}

/* ============ 背诵视图 ============ */
.flash-wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.flash-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.ctrl-group{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:12.5px;color:var(--ink-2)}
.ctrl-group select{border:none;background:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.flash-card{
  perspective:1200px;height:340px;cursor:pointer;position:relative;
}
.flash-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,.1,.2,1);
}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;
}
.flash-back{transform:rotateY(180deg)} /* 背面默认朝后，随卡片整体翻转呈现 */
.flash-face .face-hint{position:absolute;top:14px;left:18px;font-size:11px;color:var(--ink-3);letter-spacing:1px}
.flash-face .face-count{position:absolute;top:14px;right:18px;font-size:11px;color:var(--ink-3)}
.flash-front .word{font-family:var(--font-serif);font-size:44px;font-weight:900;color:var(--ink);line-height:1.2;word-break:break-word}
.flash-front .phon{font-size:17px;color:var(--accent);margin-top:10px}
.flash-front .play{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--primary);background:var(--primary-soft);padding:6px 14px;border-radius:20px;transition:all .15s}
.flash-front .play:hover{background:var(--primary);color:#fff}
.flash-back .mean{font-size:19px;font-weight:600;line-height:1.7;color:var(--ink)}
.flash-back .mean small{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:8px}
.recall-box{margin-top:18px;width:100%;max-width:380px}
.recall-box .quiz-input{font-size:15px;font-weight:500;padding:10px 14px}
.recall-compare{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.listen-box{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.flash-actions{display:flex;gap:10px;justify-content:center}
.flash-actions .btn{flex:1;max-width:170px;justify-content:center;padding:12px}
.btn-again{background:var(--danger-soft);color:var(--danger)}
.btn-again:hover{background:var(--danger);color:#fff}
.btn-hard{background:var(--accent-soft);color:var(--accent)}
.btn-hard:hover{background:var(--accent);color:#fff}
.btn-good{background:var(--success-soft);color:var(--success)}
.btn-good:hover{background:var(--success);color:#fff}
.flash-progress{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2)}
.flash-progress .progress{flex:1}
.flash-done{text-align:center;padding:40px 20px}
.flash-done h3{font-family:var(--font-serif);font-size:26px;margin-bottom:6px}
.flash-done .stat-line{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 20px;min-width:100px}
.stat-pill b{display:block;font-size:22px;font-family:var(--font-serif)}
.stat-pill span{font-size:11.5px;color:var(--ink-2)}

/* ============ 练习视图 ============ */
.practice-wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card{padding:20px;text-align:left;cursor:pointer;transition:all .15s}
.mode-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode-card.active{border-color:var(--accent);background:var(--accent-soft)}
.mode-card .mode-ico{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.mode-card .mode-ico svg{width:20px;height:20px;color:var(--accent)}
.mode-card h4{font-size:14.5px;margin-bottom:3px}
.mode-card p{font-size:12px;color:var(--ink-2)}
.quiz-card{padding:26px}
.quiz-q{font-size:15px;color:var(--ink-2);margin-bottom:14px}
.quiz-q .q-label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;background:var(--primary-soft);color:var(--primary);padding:3px 10px;border-radius:6px;margin-bottom:8px}
.quiz-target{font-size:20px;font-weight:700;line-height:1.7;background:var(--bg);border-radius:12px;padding:16px 18px;margin-bottom:16px;color:var(--ink)}
.quiz-target .phon{font-size:14px;color:var(--accent);font-weight:500;margin-left:8px}
.quiz-input{
  width:100%;font-size:19px;font-weight:700;letter-spacing:.5px;padding:12px 16px;border:2px solid var(--border);
  border-radius:12px;outline:none;transition:border-color .15s;background:var(--surface);color:var(--ink);
}
.quiz-input:focus{border-color:var(--primary)}
.quiz-input.wrong{border-color:var(--danger);background:var(--danger-soft)}
.quiz-input.right{border-color:var(--success);background:var(--success-soft)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{
  border:2px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13.5px;text-align:left;
  background:var(--surface);transition:all .12s;color:var(--ink);line-height:1.5;
}
.option:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.option.right{border-color:var(--success);background:var(--success-soft);font-weight:600}
.option.wrong{border-color:var(--danger);background:var(--danger-soft)}
.option:disabled{cursor:default;opacity:.75}
.feedback{margin-top:14px;font-size:13.5px;display:flex;align-items:center;gap:8px;min-height:26px}
.feedback .correct-ans{color:var(--success);font-weight:700}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.quiz-progress{font-size:12.5px;color:var(--ink-2)}
.quiz-score{font-size:12.5px;font-weight:700}

/* ============ 错题视图 ============ */
.wrong-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.wrong-count{font-size:13px}

/* ============ 统计视图 ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat-card{padding:18px}
.stat-card .s-num{font-family:var(--font-serif);font-size:30px;font-weight:900;line-height:1.2}
.stat-card .s-label{font-size:12px;color:var(--ink-2);margin-top:4px}
.stat-card .s-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-card .s-ico svg{width:18px;height:18px}
.ring-row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font-family:var(--font-serif);font-size:26px}
.ring-center span{font-size:11px;color:var(--ink-2)}
.ring-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ring-legend .lg{display:flex;align-items:center;gap:8px}
.ring-legend .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.week-bars{display:flex;gap:8px;align-items:flex-end;height:120px;padding:10px 0}
.week-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week-bar .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#4A7396,var(--primary));min-height:3px;transition:height .4s ease}
.week-bar .bar.zero{background:var(--bg)}
.week-bar span{font-size:10.5px;color:var(--ink-3)}

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,27,45,.45);display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(2px);
}
.modal-mask.show{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:86vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal h3{font-family:var(--font-serif);font-size:18px;margin-bottom:16px}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.modal .field input[type=number]{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;outline:none}
.modal .field input:focus{border-color:var(--primary)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #EDF1F4}
.modal-row:last-child{border-bottom:none}
.modal-row .mr-title{font-size:13.5px;font-weight:600}
.modal-row .mr-desc{font-size:11.5px;color:var(--ink-2)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#CBD5E0;border-radius:20px;transition:background .2s}
.switch .track::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(18px)}

/* ============ 单词总表 ============ */
.ws-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:20px;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ink-3)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.chip b{font-weight:700}
.ws-btn{font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface);margin:1px 3px 1px 0;transition:all .12s}
.ws-btn:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.ws-btn.on-g{background:var(--success);border-color:var(--success);color:#fff}
.ws-btn.on-o{background:var(--accent);border-color:var(--accent);color:#fff}
.ws-btn.on-r{background:var(--danger);border-color:var(--danger);color:#fff}

<script>
/* ============================================================
 * 词汇工坊 Vocab Studio
 * 本地运行 · 数据存于浏览器 localStorage · 支持导入PDF词表
 * ============================================================ */
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const STORE_KEY = 'vocab-studio-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 状态 ---------- */
let state = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE_KEY)); if(d && d.libs) return d; }catch(e){}
  return { libs:{}, activeId:null, settings:{ dailyGoal:50, tts:true, voice:'real', accent:2 }, dayLog:{}, wrongs:{} };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function getLib(id){ return state.libs[id] || null; }
function activeLib(){ return getLib(state.activeId); }

/* ---------- 发音（本地音频优先 → 系统合成兜底） ---------- */
const AUDIO_CACHE = new Map(); // 会话内缓存已加载的发音
function safeName(w){ return String(w||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'w'; }
function saySys(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
function playReal(word){
  const w=word.trim(); if(!w) return;
  const cached=AUDIO_CACHE.get(w);
  if(cached && cached.src){ cached.currentTime=0; cached.play().catch(()=>saySys(w)); return; }
  // ① 本地音频：用户可把自备发音按「单词.mp3」命名放入 assets/audio/ 作为发音资源包
  const src='assets/audio/'+safeName(w)+'.mp3';
  const a=new Audio(src);
  let done=false;
  const ok=()=>{ if(done) return; done=true; AUDIO_CACHE.set(w,a); a.play().catch(()=>saySys(w)); };
  const fail=()=>{ if(done) return; done=true; AUDIO_CACHE.delete(w); saySys(w); }; // 无本地音频 → 系统合成
  a.addEventListener('canplaythrough', ok, {once:true});
  a.addEventListener('error', fail, {once:true});
  a.load();
  setTimeout(()=>{ if(!done && a.readyState<3) fail(); }, 9000); // 超时兜底
}
function speak(text, force){
  if(!force && !state.settings.tts) return;
  if(state.settings.voice!=='sys' && typeof Audio!=='undefined'){ playReal(text); return; }
  saySys(text);
}

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg, type){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2200);
}

/* ---------- PDF解析引擎 ---------- */
function normWord(w){ return String(w||'').trim().toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim(); }
function looksLikePageNo(l){ return /^\d+$/.test(l.trim()); }
function isPhoneticLine(l){
  return /^[\[/]/.test(l.trim()) && /[\]/]$/.test(l.trim()) && !/[\u4e00-\u9fa5]/.test(l);
}
function isMeaningLine(l){
  if(!/[\u4e00-\u9fa5]/.test(l)) return false;
  if(/^第\s*\d+\s*页/.test(l)) return false;      // 页码行
  if(/(^|[\s;；])(n|v|vt|vi|a|adj|ad|adv|prep|conj|pron|num|int|art|aux|modal|det|abbr|pref|suf)\./i.test(l)) return true;
  // 无词性标记但含中文且长度足够（如纯短语释义）
  return l.length >= 5;
}
function isWordLine(l){
  if(/[\u4e00-\u9fa5]/.test(l)) return false;
  if(/[\[\]\/]/.test(l)) return /^[a-z]+[a-z' -]*\/[a-z' -]+$/i.test(l.trim()); // a/an
  return /^[A-Za-z][A-Za-z' -]{0,45}$/.test(l.trim());
}
function parseVocabLines(rawLines){
  const lines = rawLines.map(l=>l.trim()).filter(l=>l && !looksLikePageNo(l) && !/第\s*\d+\s*页/.test(l) && l.length<200);
  const out=[]; const seen=new Set(); let skipped=0; let i=0;
  // 词条格式： 排名 单词 音标 [权重/次数] 释义   （释义可跨行）
  const RE_ENTRY = /^(\d{1,4})\s+([A-Za-z][A-Za-z' .\-]*?)\s+(\/[^\/\n]+\/)\s+\[(\d+(?:\.\d+)?)\/(\d+)\]\s*([\s\S]*)$/;
  const RE_ENTRY_NP = /^(\d{1,4})\s+([A-Za-z][A-Za-z' .\-]*?)\s+\[(\d+(?:\.\d+)?)\/(\d+)\]\s*([\s\S]*)$/;
  const isMeanCont = l => {
    if(!/[\u4e00-\u9fa5]/.test(l)) return false;
    if(/^第\s*\d+\s*页/.test(l)) return false;
    if(/^\d{1,4}\s+[A-Za-z]/.test(l)) return false;
    if(/排名|序号|部分|词条|语料|加权|释义|格式|词汇表|Vocabulary/.test(l)) return false;
    if(/^[\d]+\s*[-–—]\s*[\d]*$/.test(l)) return false;
    return l.length >= 4;
  };
  const pushWord=(word,phon,mean,freq)=>{
    const key=normWord(word);
    if(key && !seen.has(key)){ seen.add(key); out.push({ word, phonetic:phon, meaning:(mean||'').trim()||'(释义缺失)', freq:freq||0 }); }
    else skipped++;
  };
  while(i<lines.length){
    const L = lines[i];
    const mE = L.match(RE_ENTRY);
    if(mE){
      let mean=mE[6]||''; i++;
      while(i<lines.length && isMeanCont(lines[i])){ mean+=lines[i]; i++; }
      pushWord(mE[2], mE[3], mean, +mE[5]); continue;
    }
    const mN = L.match(RE_ENTRY_NP);
    if(mN){
      let mean=mN[5]||''; i++;
      while(i<lines.length && isMeanCont(lines[i])){ mean+=lines[i]; i++; }
      pushWord(mN[2], '', mean, +mN[4]); continue;
    }
    if(isWordLine(L)){
      let word=L, phon='', mean=''; i++;
      if(i<lines.length && isPhoneticLine(lines[i])){ phon=lines[i]; i++; }
      while(i<lines.length && isMeaningLine(lines[i])){ mean += (mean?'；':'') + lines[i]; i++; }
      if(!mean){ // 释义缺失，回退检查下一行是否为释义
        if(i<lines.length && isMeaningLine(lines[i])){ mean=lines[i]; i++; }
      }
      pushWord(word, phon, mean);
    } else {
      // 兜底：同行同时包含 单词 + 音标 + 释义，如 "abandon /ə'bændən/ vt.放弃"
      const m = L.match(/^([A-Za-z][A-Za-z' -]*?)\s+(\/[^/]+\/)\s+([\u4e00-\u9fa5].+)$/);
      if(m){ pushWord(m[1], m[2], m[3]); i++; }
      else {
        // 兜底2：同行包含 单词 + 释义（无音标），如 "abandon vt.放弃"
        const m2 = L.match(/^([A-Za-z][A-Za-z' -]*?)\s+((?:n|v|vt|vi|a|adj|ad|adv|prep|conj|pron|num|int|art|aux|modal|det|abbr)\.\s*[\u4e00-\u9fa5].+)$/i);
        if(m2){ pushWord(m2[1], '', m2[2]); i++; }
        else i++;
      }
    }
  }
  return { words:out, skipped };
}
async function extractPdfText(file){
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data:ab }).promise;
  const lines=[];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let lastY=null, line='';
    for(const it of tc.items){
      const y = it.transform[5];
      if(lastY!==null && Math.abs(y-lastY)>3){ lines.push(line); line=''; }
      line += it.str || '';
      lastY=y;
    }
    if(line.trim()) lines.push(line);
  }
  return lines;
}

/* ============================================================
 * 视图切换
 * ============================================================ */
const VIEW_TITLES = { library:'词库', flashcard:'背诵', practice:'练习', wrong:'错题', notebook:'词本', wordsheet:'单词总表', stats:'统计' };
let currentView='library';
function switchView(v){
  currentView=v;
  $$('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  $('#topbar-title').textContent=VIEW_TITLES[v];
  $('#content').innerHTML='';
  const map={ library:renderLibrary, flashcard:renderFlashcard, practice:renderPractice, wrong:renderWrong, notebook:renderNotebook, wordsheet:renderWordsheet, stats:renderStats };
  (map[v]||renderLibrary)();
}
$$('.nav-item').forEach(b=>b.addEventListener('click', ()=>switchView(b.dataset.view)));

/* ============================================================
 * 词库视图
 * ============================================================ */
function renderLibrary(){
  const libs=Object.values(state.libs);
  const active=activeLib();
  let html=`
  <div class="section-head">
    <div><h2>我的词库</h2><div class="desc">导入 PDF 词汇表，或使用内置示例词库开始学习</div></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" id="btn-demo-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建示例词库</button>
      <button class="btn btn-ghost" id="btn-json-import" title="导入词汇工坊词库文件(.json)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导入词库文件</button>
      <button class="btn btn-accent" id="btn-import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导入 PDF 词表</button>
    </div>
  </div>`;
  if(libs.length===0){
    html+=`<div class="card empty">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <h3>还没有词库</h3>
      <p>把任何 PDF 词汇表导入进来，就能开始背诵和填空练习</p>
      <button class="btn btn-accent" id="btn-import-2">导入第一份 PDF</button>
    </div>`;
  } else {
    html+=`<div class="lib-grid">`+libs.map(l=>{
      const n=l.words.length;
      const st=progressOf(l);
      const pct=Math.round(st.mastered/n*100);
      const isAct=active&&active.id===l.id;
      return `<div class="card lib-card ${isAct?'':''}" data-open="${l.id}">
        <button class="lib-del" data-del="${l.id}" title="删除词库"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        <div class="lib-top">
          <div class="lib-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
          <div style="min-width:0"><div class="lib-name">${esc(l.name)}${isAct?' <span class="badge badge-blue">当前</span>':''}</div><div class="lib-meta">${l.source||'本地词库'} · ${n} 词</div></div>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="lib-progress"><span>已掌握 ${st.mastered}</span><span>${pct}%</span></div>
      </div>`;
    }).join('')+`</div>`;
  }
  $('#content').innerHTML=html;
  const open=$$('.lib-card'); open.forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.lib-del')) return;
    setActiveLib(c.dataset.open); renderLibrary(); toast('已切换到词库：'+(activeLib()||{}).name);
  }));
  $$('.lib-del').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    if(!confirm('删除词库「'+ (getLib(b.dataset.del)||{}).name +'」？学习记录也会一并删除。')) return;
    delete state.libs[b.dataset.del];
    if(state.activeId===b.dataset.del) state.activeId=null;
    save(); renderLibrary();
  }));
  $('#btn-demo-lib').addEventListener('click', addDemoLib);

/* ---------- 学习状态（含间隔重复复习调度 SRS） ---------- */
const SRS_INTERVALS=[1,2,4,7,15]; // 复习间隔天数：认识→1/2/4/7/15天递进
function ensureProgress(lib){
  if(!lib.prog){ lib.prog={}; }
  if(!state.wrongs[lib.id]) state.wrongs[lib.id]={};
  return lib.prog;
}
function progressOf(lib){
  ensureProgress(lib);
  let newC=0, fuzzy=0, unknown=0, mastered=0;
  lib.words.forEach(w=>{
    const s=lib.prog[w.id];
    if(!s || s.status==='new') newC++;
    else if(s.status==='mastered') mastered++;
    else if(s.status==='unknown') unknown++;
    else fuzzy++; // fuzzy / learning(旧数据)
  });
  return { total:lib.words.length, new:newC, fuzzy, unknown, mastered, learning:fuzzy+unknown };
}
function statusWord(lib, wid, status){
  ensureProgress(lib);
  const s=lib.prog[wid]=lib.prog[wid]||{status:'new',wrongs:0,seen:0};
  s.status=status; s.seen=(s.seen||0)+1;
  const now=Date.now(), DAY=86400000;
  if(status==='mastered'){
    s.masteredAt=now;
    s.srsStep=Math.min((s.srsStep||0)+1, SRS_INTERVALS.length);
    s.reviewAt=now + SRS_INTERVALS[s.srsStep-1]*DAY; // 按间隔递进排期
    delete state.wrongs[lib.id][wid];
  } else if(status==='fuzzy'){
    s.srsStep=Math.max(1,(s.srsStep||2)-1);
    s.reviewAt=now + SRS_INTERVALS[0]*DAY; // 1 天后回来看
  } else if(status==='unknown'){
    s.srsStep=0;
    s.reviewAt=now; // 立即进入复习队列
  }
  save();
}
function addToWrong(lib, wid){
  ensureProgress(lib);
  const s=lib.prog[wid]=lib.prog[wid]||{status:'new',wrongs:0,seen:0};
  s.wrongs=(s.wrongs||0)+1;
  state.wrongs[lib.id][wid]=(state.wrongs[lib.id][wid]||0)+1;
  if(s.status!=='mastered'){ s.status='learning'; s.reviewAt=Date.now(); }
  save();
}
function wrongCount(lib){ return Object.keys(state.wrongs[lib.id]||{}).length; }
function isWrong(lib, wid){ return !!(state.wrongs[lib.id]||{})[wid]; }
function dueWords(lib){
  const now=Date.now();
  return lib.words.filter(w=>{ const p=lib.prog[w.id]; return p && p.reviewAt && p.reviewAt<=now; });
}
function backfillSrs(lib){
  const now=Date.now(), DAY=86400000;
  lib.words.forEach(w=>{
    const p=lib.prog[w.id]; if(!p||!p.status||p.reviewAt) return;
    if(p.status==='mastered'){ p.srsStep=2; p.reviewAt=now; }               // 老已掌握词：今日复习一次
    else if(p.status==='fuzzy'||p.status==='learning'){ p.srsStep=1; p.reviewAt=now+DAY; }
    else if(p.status==='unknown'){ p.srsStep=0; p.reviewAt=now; }
  });
}
function exportWords(words, filename){
  if(!words.length){ toast('没有可导出的单词','err'); return; }
  const rows=['单词,音标,释义,出现次数,掌握程度'];
  const stName={mastered:'已掌握',fuzzy:'模糊',learning:'模糊',unknown:'不认识'};
  words.forEach(w=>{
    const p=activeLib().prog[w.id];
    rows.push([w.word, (w.phonetic||'').replace(/,/g,' '), (w.meaning||'').replace(/,/g,'，'), w.freq||'', p? (stName[p.status]||'未选择') : '未选择'].join(','));
  });
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  URL.revokeObjectURL(a.href); toast('已导出 '+words.length+' 词');
}

function buildQueue(lib, scope, order){
  let arr=[];
  const st=w=>lib.prog[w.id]&&lib.prog[w.id].status;
  if(scope==='wrong') arr=lib.words.filter(w=>isWrong(lib,w.id));
  else if(scope==='due') arr=dueWords(lib).sort((a,b)=>(lib.prog[a.id].reviewAt||0)-(lib.prog[b.id].reviewAt||0));
  else if(scope==='new') arr=lib.words.filter(w=>st(w)!=='mastered');
  else if(scope==='mastered') arr=lib.words.filter(w=>st(w)==='mastered');
  else if(scope==='fuzzy') arr=lib.words.filter(w=>st(w)==='fuzzy'||st(w)==='learning');
  else if(scope==='unknown') arr=lib.words.filter(w=>st(w)==='unknown');
  else if(scope==='top800'||scope==='top1500'){
    const n=scope==='top800'?800:1500;
    arr=[...lib.words].sort((a,b)=>(b.freq||0)-(a.freq||0)).slice(0,n);
  }
  else arr=[...lib.words];
  if(order==='shuffle') for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function renderFcEmpty(){
  const hints={
    wrong:'错题本是空的，去练习几道题就会自动收录',
    due:'今天没有到期的复习词。去背诵或练习标记一些词，它们会按 1/2/4/7/15 天自动回来复习',
    top800:'这个词库不到 800 个单词，已全部包含',
    top1500:'这个词库不到 1500 个单词，已全部包含',
    unknown:'「不认识本」还没有单词，去背诵模式给单词归类后就会出现',
    fuzzy:'「模糊本」还没有单词，背诵时标为「模糊」就会收进来',
    mastered:'「已掌握本」还没有单词，背诵时标为「认识」就会收进来',

        input.classList.add('right'); pScore.right++; statusWord(lib,w.id,'mastered');
      } else {
        fb.innerHTML='<span style="color:var(--danger);font-weight:700">答错了</span> 正确答案：<span class="correct-ans">'+esc(w.word)+'</span> '+esc(w.phonetic||'');
        input.classList.add('wrong'); pScore.wrong++; addToWrong(lib,w.id);
        if(testMode) testWrongs.push(w);
      }
      $('#pq-check').textContent='下一题'; updatePqScore();
    };
    $('#pq-check').addEventListener('click', check);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
    $('#pq-skip').addEventListener('click', ()=>{ addToWrong(lib,w.id); pScore.wrong++; if(testMode) testWrongs.push(w); nextPq(); });
  } else {
    const opts=pickOptions(lib,w);
    $('#pq-area').innerHTML=`

      </div>

      <div class="feedback" id="pq-fb"></div>
      <div class="quiz-foot">
        <span class="quiz-score">正确 <b style="color:var(--success)">${pScore.right}</b> · 错误 <b style="color:var(--danger)">${pScore.wrong}</b></span>
        <button class="btn btn-ghost" id="pq-skip">跳过</button>
      </div>
    </div>`;
    let answered=false;
    $('#pq-sound').addEventListener('click', ()=>speak(w.word, true));
    $$('#pq-opts .option').forEach(b=>b.addEventListener('click',()=>{
      if(answered) return; answered=true;

      else{

        if(testMode) testWrongs.push(w);
        $$('#pq-opts .option').forEach(o=>{ if(o.dataset.correct==='1') o.classList.add('right'); });
        $('#pq-fb').innerHTML='<span style="color:var(--danger);font-weight:700">答错了</span> 正确答案已标绿';
      }
      $$('#pq-opts .option').forEach(o=>o.disabled=true);
      $('#pq-skip').textContent='下一题'; updatePqScore();
    }));
    $('#pq-skip').addEventListener('click', ()=>{ if(answered){ nextPq(); return; } addToWrong(lib,w.id); pScore.wrong++; if(testMode) testWrongs.push(w); nextPq(); });
  }
  if(state.settings.tts && pMode==='choice') speak(w.word);
}
function pickOptions(lib, cur){
  const others=lib.words.filter(w=>w.id!==cur.id && normWord(w.word)!==normWord(cur.word));
  const pool=[];
  const used=new Set();
  while(pool.length<3 && others.length){
    const o=others[Math.floor(Math.random()*others.length)];
    if(!used.has(normWord(o.word))){ used.add(normWord(o.word)); pool.push(o); }
    if(pool.length+used.size>Math.min(60,others.length)*2) break;
  }
  const arr=[{text:cur.meaning, correct:true}];
  pool.forEach(o=>arr.push({text:o.meaning, correct:false}));
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

let wsFilter='all', wsPage=1, wsSearch='';
function renderWordsheet(){
  const lib=activeLib();
  if(!lib){ renderNoLib('总表'); return; }
  const stOf=w=>lib.prog[w.id]&&lib.prog[w.id].status;
  const cnt={all:lib.words.length, mastered:0, fuzzy:0, unknown:0, new:0};
  lib.words.forEach(w=>{ const s=stOf(w); if(s==='mastered')cnt.mastered++; else if(s==='fuzzy'||s==='learning')cnt.fuzzy++; else if(s==='unknown')cnt.unknown++; else cnt.new++; });
  const q=(wsSearch||'').trim().toLowerCase();
  const list=lib.words.filter(w=>{
    const s=stOf(w);
    if(wsFilter==='mastered'&&s!=='mastered') return false;
    if(wsFilter==='fuzzy'&&!(s==='fuzzy'||s==='learning')) return false;
    if(wsFilter==='unknown'&&s!=='unknown') return false;
    if(wsFilter==='new'&&s&&s!=='new') return false;
    if(q && !(w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q))) return false;
    return true;
  });
  const pageSize=50, pages=Math.max(1,Math.ceil(list.length/pageSize));
  if(wsPage>pages) wsPage=pages;
  const slice=list.slice((wsPage-1)*pageSize, wsPage*pageSize);
  const chip=(key,label,n)=>{ const cls='chip '+(wsFilter===key?'active':''); return `<button class="${cls}" data-f="${key}">${label} <b>${n}</b></button>`; };
  $('#content').innerHTML=`

      <div class="search-box" style="max-width:240px;margin-left:0">

      <input id="ws-search" placeholder="搜索单词或释义…" value="${esc(wsSearch)}" autocomplete="off" style="border:none;background:none;outline:none;width:100%;font-size:13px">
    </div></div></div>
  <div class="ws-chips">
    ${chip('all','全部',cnt.all)}${chip('mastered','已掌握',cnt.mastered)}${chip('fuzzy','模糊',cnt.fuzzy)}${chip('unknown','不认识',cnt.unknown)}${chip('new','未选择',cnt.new)}
  </div>`;
  if(list.length===0){
    $('#content').innerHTML+=`<div class="card empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
      <h3>没有符合条件的单词</h3><p>换个筛选条件或搜索词试试</p></div>`;
  } else {
    $('#content').innerHTML+=`<div class="card">
    <div class="preview-scroll" style="max-height:62vh">
    <table class="list-table"><colgroup><col style="width:22%"><col style="width:24%"><col style="width:34%"><col style="width:20%"></colgroup>
      <thead><tr><th>单词</th><th>音标</th><th>释义</th><th style="text-align:center">掌握程度</th></tr></thead><tbody>
      ${slice.map(w=>{
        const s=stOf(w);
        const unmarked=(!s||s==='new');
        return `<tr>
          <td class="word-cell">${esc(w.word)}<button class="play" style="margin-left:6px;color:var(--primary);vertical-align:middle" data-say="${esc(w.word)}"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>${unmarked?'<span class="badge badge-gray" style="margin-left:4px">未选</span>':''}</td>
          <td class="phon-cell">${esc(w.phonetic||'')}</td>
          <td>${esc(w.meaning)}</td>
          <td style="text-align:center;white-space:nowrap">
            <button class="ws-btn ${s==='mastered'?'on-g':''}" data-set="mastered" data-id="${w.id}">认识</button>
            <button class="ws-btn ${s==='fuzzy'||s==='learning'?'on-o':''}" data-set="fuzzy" data-id="${w.id}">模糊</button>

    $('#ws-next').addEventListener('click',()=>{ if(wsPage<pages){ wsPage++; renderWordsheet(); } });

  $$('.chip').forEach(c=>c.addEventListener('click',()=>{ wsFilter=c.dataset.f; wsPage=1; renderWordsheet(); }));
  const si=$('#ws-search');
  let wsTimer=null;
  si.addEventListener('input',()=>{ clearTimeout(wsTimer); wsTimer=setTimeout(()=>{ wsSearch=si.value; wsPage=1; renderWordsheet(); },250); });
  $('#ws-export').addEventListener('click',()=>exportWords(list, '筛选词表-'+wsFilter+'-'+todayStr()+'.csv'));
}

function getWeekLog(){
  const out=[]; const now=new Date(); let max=0;
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    const v=state.dayLog[key]||{flash:0,practice:0,right:0};
    const label=(d.getMonth()+1)+'/'+d.getDate();
    out.push({label, flash:v.flash||0, practice:v.practice||0, right:v.right||0});
    max=Math.max(max,(v.flash||0)+(v.practice||0));
  }
  return {days:out, weekMax:max};
}
let weekMax=0;
function logDay(lib, data){
  const t=todayStr();
  state.dayLog[t]=state.dayLog[t]||{flash:0,practice:0,right:0};
  if(data.flash) state.dayLog[t].flash+=data.flash;
  if(data.practice){ state.dayLog[t].practice+=data.practice; state.dayLog[t].right+=(data.right||0); }
  save();
}

  toast('PDF 解析组件未加载，导入功能不可用', 'err');
}
init();
</script>
